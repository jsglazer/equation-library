version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    # One PR for all actions: github/codeql-action's init/analyze/upload-sarif must move together,
    # and separate PRs leave them on mismatched versions so every one fails.
    groups:
      actions:
        patterns: ['*']
